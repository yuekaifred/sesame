<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sesame</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #feed {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      transform: translateY(0);
      transition: transform 0.4s ease;
    }

    .slide img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <div id="feed"></div>

  <script>
    const feed = document.getElementById('feed');
    const IMAGES = ['devious.jpeg', 'gaze.jpeg', 'polite.jpeg', 'crazy.jpeg', 'scared.jpeg'];

    let index = 0;
    let animating = false;
    let scrollAccum = 0;
    const THRESHOLD = 150;

    function makeSlide(name) {
      const slide = document.createElement('div');
      slide.className = 'slide';
      const img = document.createElement('img');
      img.src = `images/${name}`;
      slide.appendChild(img);
      return slide;
    }

    let current = makeSlide(IMAGES[index]);
    feed.appendChild(current);

    function goTo(nextIndex, direction) {
      animating = true;
      const next = makeSlide(IMAGES[nextIndex]);
      next.style.transition = 'none';
      next.style.transform = `translateY(${direction * 100}%)`;
      feed.appendChild(next);
      next.offsetHeight;

      requestAnimationFrame(() => {
        next.style.transition = 'transform 0.4s ease';
        current.style.transform = `translateY(${-direction * 100}%)`;
        next.style.transform = 'translateY(0)';
      });

      current.addEventListener('transitionend', function handler() {
        current.removeEventListener('transitionend', handler);
        current.remove();
        current = next;
        index = nextIndex;
        animating = false;
      }, {once: true});
    }

    function goNext() {
      goTo((index + 1) % IMAGES.length, 1);
    }

    function goPrev() {
      goTo((index - 1 + IMAGES.length) % IMAGES.length, -1);
    }

    window.addEventListener('wheel', (e) => {
      if (animating) return;
      scrollAccum += e.deltaY;
      if (scrollAccum >= THRESHOLD) {
        scrollAccum = 0;
        goNext();
      } else if (scrollAccum <= -THRESHOLD) {
        scrollAccum = 0;
        goPrev();
      }
    }, {passive: true});

    let touchStartY = null;

    window.addEventListener('touchstart', (e) => {
      if (animating) return;
      touchStartY = e.touches[0].clientY;
    }, {passive: true});

    window.addEventListener('touchend', (e) => {
      if (animating || touchStartY === null) return;
      const deltaY = touchStartY - e.changedTouches[0].clientY;
      touchStartY = null;
      if (deltaY >= THRESHOLD) {
        goNext();
      } else if (deltaY <= -THRESHOLD) {
        goPrev();
      }
    }, {passive: true});
  </script>
</body>

</html>
