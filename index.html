<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sesame</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #feed {
      width: 100%;
      height: 100vh;
    }

    .slide {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .slide img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    #feed.touch-mode {
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }

    #feed.touch-mode .slide {
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    #feed.desktop-mode {
      position: relative;
      overflow: hidden;
    }

    #feed.desktop-mode .slide {
      position: absolute;
      inset: 0;
      transform: translateY(0);
      transition: transform 0.4s ease;
    }

    #sound-cta {
      position: fixed;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 12px 20px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font: 700 clamp(16px, 4vw, 26px)/1 system-ui, sans-serif;
      letter-spacing: 0.5px;
      white-space: nowrap;
      pointer-events: none;
      animation: cta-pulse 1s ease-in-out infinite;
    }

    @keyframes cta-pulse {
      0%, 100% { opacity: 1; transform: translateX(-50%) scale(1); }
      50% { opacity: 0.55; transform: translateX(-50%) scale(0.94); }
    }
</style>
</head>

<body>
  <div id="feed"></div>
  <div id="sound-cta"></div>

  <script>
    const feed = document.getElementById('feed');
    const IMAGES = ['devious.jpeg', 'gaze.jpeg', 'polite.jpeg', 'crazy.jpeg', 'scared.jpeg'];
    const isTouch = window.matchMedia('(pointer: coarse)').matches;

    const START = { devious: 0, gaze: 0, polite: 0, crazy: 0, scared: 0 };
    const moodOf = name => name.replace(/\.jpeg$/, '');

    const audio = new Audio();
    audio.preload = 'auto';
    audio.loop = false;
    let currentMood = null;
    let soundEnabled = false;

    function seekToStart() {
      try { audio.currentTime = START[currentMood] || 0; } catch (e) {}
    }

    function setMood(mood) {
      if (mood === currentMood) return;
      currentMood = mood;
      audio.src = `audio/${mood}.mp4`;
      audio.load();
      audio.addEventListener('loadedmetadata', function h() {
        audio.removeEventListener('loadedmetadata', h);
        seekToStart();
        if (soundEnabled) audio.play().catch(() => {});
      });
    }

    audio.addEventListener('ended', () => {
      seekToStart();
      if (soundEnabled) audio.play().catch(() => {});
    });

    const cta = document.getElementById('sound-cta');
    cta.textContent = isTouch ? 'TAP FOR SOUND!!' : 'CLICK FOR SOUND!!';

    function enableSound() {
      if (soundEnabled) return;
      soundEnabled = true;
      cta.remove();
      audio.play().catch(() => {});
    }
    document.addEventListener('click', enableSound);
    document.addEventListener('touchstart', enableSound, { passive: true });

    function makeSlide(name) {
      const slide = document.createElement('div');
      slide.className = 'slide';
      slide.dataset.mood = moodOf(name);
      const img = document.createElement('img');
      img.src = `images/${name}`;
      img.loading = 'lazy';
      slide.appendChild(img);
      return slide;
    }

    if (isTouch) {
      feed.classList.add('touch-mode');

      const io = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting && e.intersectionRatio >= 0.6) {
            setMood(e.target.dataset.mood);
          }
        });
      }, { threshold: [0.6] });

      function appendBatch() {
        IMAGES.forEach(name => {
          const s = makeSlide(name);
          feed.appendChild(s);
          io.observe(s);
        });
      }

      for (let r = 0; r < 3; r++) appendBatch();
      setMood(moodOf(IMAGES[0]));

      feed.addEventListener('scroll', () => {
        if (feed.scrollTop + feed.clientHeight * 3 >= feed.scrollHeight) {
          appendBatch();
        }
      }, { passive: true });
    } else {
      feed.classList.add('desktop-mode');

      let index = 0;
      let animating = false;
      let scrollAccum = 0;
      const THRESHOLD = 150;

      const preloaded = new Set();

      function preload(i) {
        const name = IMAGES[i % IMAGES.length];
        if (preloaded.has(name)) return;
        preloaded.add(name);
        new Image().src = `images/${name}`;
      }

      preload(index);
      preload(index + 1);
      preload(index - 1);

      let current = makeSlide(IMAGES[index]);
      feed.appendChild(current);
      setMood(moodOf(IMAGES[index]));

      function goTo(nextIndex, direction) {
        setMood(moodOf(IMAGES[nextIndex]));
        preload(nextIndex + 1);
        preload(nextIndex - 1);
        animating = true;
        const next = makeSlide(IMAGES[nextIndex]);
        next.style.transition = 'none';
        next.style.transform = `translateY(${direction * 100}%)`;
        feed.appendChild(next);
        next.offsetHeight;

        requestAnimationFrame(() => {
          next.style.transition = 'transform 0.4s ease';
          current.style.transform = `translateY(${-direction * 100}%)`;
          next.style.transform = 'translateY(0)';
        });

        current.addEventListener('transitionend', function handler() {
          current.removeEventListener('transitionend', handler);
          current.remove();
          current = next;
          index = nextIndex;
          animating = false;
        }, {once: true});
      }

      function goNext() {
        goTo((index + 1) % IMAGES.length, 1);
      }

      function goPrev() {
        goTo((index - 1 + IMAGES.length) % IMAGES.length, -1);
      }

      window.addEventListener('wheel', (e) => {
        if (animating) return;
        scrollAccum += e.deltaY;
        if (scrollAccum >= THRESHOLD) {
          scrollAccum = 0;
          goNext();
        } else if (scrollAccum <= -THRESHOLD) {
          scrollAccum = 0;
          goPrev();
        }
      }, {passive: true});
    }
  </script>
</body>

</html>
